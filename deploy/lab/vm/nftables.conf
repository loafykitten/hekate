#!/usr/sbin/nft -f
# Hekate's lab: SSH only over the tailnet. No "flush ruleset": Docker keeps its own tables.
table inet lab_guard
delete table inet lab_guard
table inet lab_guard {
	chain input {
		type filter hook input priority filter; policy accept;
		tcp dport 22 iifname != { "lo", "tailscale0" } drop
	}
}
